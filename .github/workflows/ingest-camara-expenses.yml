name: Ingest Câmara expenses

on:
    schedule:
        # every day at 07:30 UTC, after the deputies workflow
        - cron: "30 7 * * *"
    workflow_dispatch:
        inputs:
            year:
                description: "Year of the quota file, empty for the current year"
                required: false

# a manual run must not overlap with a scheduled one, both replace the expenses of a year
concurrency:
    group: ingest-camara-expenses
    cancel-in-progress: false

jobs:
    ingest:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # prisma generate also loads the config, which requires the variable
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
            # after writing, the runner asks the site to refresh its pages
            REVALIDATE_URL: ${{ vars.REVALIDATE_URL }}
            REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm db:generate

            - run: pnpm ingest camara-expenses "${YEAR:-$(date +%Y)}"
              env:
                  YEAR: ${{ inputs.year }}