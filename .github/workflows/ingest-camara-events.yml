name: Ingest Câmara events

on:
    schedule:
        # every day at 09:30 UTC, after the deputies and organs workflows
        - cron: "30 9 * * *"
    workflow_dispatch:
        inputs:
            year:
                description: "Year of the event files, empty for the current year"
                required: false

# a manual run must not overlap with a scheduled one, both replace the same event tables
concurrency:
    group: ingest-camara-events
    cancel-in-progress: false

jobs:
    ingest:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # prisma generate also loads the config, which requires the variable
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm db:generate

            - run: pnpm ingest camara-events "${YEAR:-$(date +%Y)}"
              env:
                  YEAR: ${{ inputs.year }}