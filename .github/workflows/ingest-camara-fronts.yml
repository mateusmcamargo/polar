name: Ingest Câmara fronts

on:
    schedule:
        # every day at 09:00 UTC, after the deputies workflow
        - cron: "0 9 * * *"
    workflow_dispatch:

# a manual run must not overlap with a scheduled one, both replace the same membership table
concurrency:
    group: ingest-camara-fronts
    cancel-in-progress: false

jobs:
    ingest:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        # prisma generate also loads the config, which requires the variable
        env:
            DATABASE_URL: ${{ secrets.DATABASE_URL }}
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - run: pnpm install --frozen-lockfile

            - run: pnpm db:generate

            - run: pnpm ingest camara-fronts