services:
    database:
        image: postgres:18-alpine
        container_name: polar-database
        restart: unless-stopped
        environment:
            POSTGRES_USER: polar
            POSTGRES_PASSWORD: polar
            POSTGRES_DB: polar
        ports:
            - "5432:5432"
        volumes:
            # postgres 18 images keep data under a versioned folder inside this path
            - database-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U polar -d polar"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    database-data: